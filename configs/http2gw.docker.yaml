node:
  node_id: 1
  instance_id: http2gw-docker

http:
  listen: 0.0.0.0
  port: 8080
  remote: ""

udp:
  listen: 0.0.0.0
  port: 9000
  inbound_queue_size: 8192
  inbound_workers: 2

heartbeat:
  interval: 1000ms
  timeout: 3000ms

transaction:
  timeout: 5000ms

routing:
  strategy: consistent_hash

services:
  - service_id: 1
    service_name: http2gw
    message_types: [1001, 1002, 1003]
