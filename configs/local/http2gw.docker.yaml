node:
  node_id: 10
  instance_id: http2gw-docker-local
  name: http2gw
  type: http2_server
  group: local-server
  ip: http2gw

http:
  listen: 0.0.0.0
  port: 8080

udp:
  listen: 0.0.0.0
  port: 9000

heartbeat:
  interval: 1000ms
  timeout: 3000ms
  dead_timeout: 6000ms

transaction:
  timeout: 5000ms

routing:
  strategy: consistent_hash

services:
  - service_id: 1
    service_name: http2gw
    message_types: [1001, 1002, 1003]

resource:
  cpu_cores: 4
  memory: 8G

master_url: http://master:9200
