# HTTP2GW — local deployment. ID scheme: 10=http2gw.
node:
  node_id: 10
  instance_id: http2gw-local
  name: http2gw
  type: http2_server
  group: local-server
  ip: 127.0.0.1

http:
  listen: 127.0.0.1
  port: 8080
  max_rps: 10000
  max_rps_burst: 2000
  max_pending: 600
  pprof_listen: "127.0.0.1:6060"

udp:
  listen: 127.0.0.1
  port: 9000
  inbound_queue_size: 16384
  inbound_workers: 2

heartbeat:
  interval: 1000ms
  timeout: 3000ms
  dead_timeout: 6000ms

transaction:
  timeout: 5000ms

routing:
  strategy: consistent_hash

services:
  - service_id: 1
    service_name: http2gw
    message_types: [1001, 1002, 1003]

resource:
  cpu_cores: 1
  memory: 2G

master_url: http://127.0.0.1:9200
