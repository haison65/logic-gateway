# Logic-2 — UDP 9101, node_id=3.
node:
  node_id: 3
  instance_id: logic-2-local
  name: logic-2
  type: logic
  group: local-server
  ip: 127.0.0.1

udp:
  listen: 127.0.0.1
  port: 9101

gateway:
  host: 127.0.0.1
  port: 9000

services:
  - service_id: 100
    service_name: call
    message_types: [1001, 1002, 1003]

heartbeat:
  interval: 1000ms
  timeout: 3000ms

resource:
  cpu_cores: 6
  memory: 8G

master_url: http://127.0.0.1:9200
