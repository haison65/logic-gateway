syntax = "proto3";

package logicgateway.v1;

option go_package = "github.com/haison65/logic-gateway/proto/gen/go;logicgatewayv1";

// ErrorCode là mã lỗi tầng ứng dụng trên Envelope.
enum ErrorCode {
  ERROR_CODE_UNKNOWN = 0;
  ERROR_CODE_TIMEOUT = 1;
  ERROR_CODE_NODE_NOT_AVAILABLE = 2;
  ERROR_CODE_INVALID_MESSAGE = 3;
  ERROR_CODE_OVERLOAD = 4;
  ERROR_CODE_UDP_SEND_FAILED = 5;
  ERROR_CODE_LOGIC_TIMEOUT = 6;
  ERROR_CODE_HEARTBEAT_TIMEOUT = 7;
  ERROR_CODE_NO_ROUTING_TARGET = 8;
}

// ErrorMessage mô tả lỗi gửi kèm Envelope.
message ErrorMessage {
  ErrorCode code = 1;
  string message = 2;
}
