# Scrape http2gw + Logic Prometheus exposition (/metrics).
# Dùng với docker-compose (target DNS) hoặc scrape host khi chạy go run.

global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  # Gateway trong cùng mạng Compose
  - job_name: http2gw
    metrics_path: /metrics
    static_configs:
      - targets: ["http2gw:8080"]
        labels:
          env: compose

  # Gateway chạy trên host (go run). Windows/Mac Docker Desktop + Linux với host-gateway.
  - job_name: http2gw-host
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8080"]
        labels:
          env: host

  # Logic ×3 (docker-compose.local.yml) — mỗi container :9190/metrics
  - job_name: logic
    metrics_path: /metrics
    static_configs:
      - targets:
          - "logic-1:9190"
          - "logic-2:9190"
          - "logic-3:9190"
        labels:
          env: compose

  # Logic đơn (docker-compose.yml)
  - job_name: logic-single
    metrics_path: /metrics
    static_configs:
      - targets: ["logic:9190"]
        labels:
          env: compose
