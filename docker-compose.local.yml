# Local: clients (profile load) -> http2gw -> logic x3
# Load: configs/local/load.request.yaml + .\scripts\start.ps1
#
# cpuset: master=0 prometheus=1 logic=3-4/5-6/7-8
#         client-1..5=9-10..17-18 client-6=9-10 http2gw=20

services:
  master:
    build:
      context: .
      dockerfile: Dockerfile
      target: master
    image: logic-gateway/master:local
    hostname: master
    init: true
    stop_grace_period: 10s
    command: ["-config", "/configs/master.yaml", "-debug=false"]
    environment:
      - GOMAXPROCS=1
    cpus: 1.0
    cpuset: "0"
    mem_limit: 512m
    ports:
      - "9200:9200/tcp"
    networks:
      - app
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  http2gw:
    build:
      context: .
      dockerfile: Dockerfile
      target: http2gw
    image: logic-gateway/http2gw:local
    hostname: http2gw
    init: true
    stop_grace_period: 10s
    command: ["-config", "/configs/http2gw.yaml", "-debug=false"]
    volumes:
      - ./configs/local/http2gw.docker.yaml:/configs/http2gw.yaml:ro
    environment:
      - GOMAXPROCS=1
      - GOGC=200
    cpus: 1.0
    cpuset: "20"
    mem_limit: 2g
    user: "0:0"
    cap_add:
      - NET_ADMIN
    ports:
      - "8080:8080/tcp"
      - "6060:6060/tcp"
    depends_on:
      - master
    networks:
      - app
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  logic-1:
    build:
      context: .
      dockerfile: Dockerfile
      target: logic
    image: logic-gateway/logic:local
    hostname: logic-1
    init: true
    stop_grace_period: 10s
    command: ["-config", "/configs/logic.yaml", "-debug=false"]
    volumes:
      - ./configs/local/logic-1.docker.yaml:/configs/logic.yaml:ro
    ports:
      - "9191:9190/tcp"
    environment:
      - GOMAXPROCS=2
    cpus: 2.0
    cpuset: "3-4"
    mem_limit: 2g
    user: "0:0"
    cap_add:
      - NET_ADMIN
    depends_on:
      - http2gw
      - master
    networks:
      - app
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  logic-2:
    build:
      context: .
      dockerfile: Dockerfile
      target: logic
    image: logic-gateway/logic:local
    hostname: logic-2
    init: true
    stop_grace_period: 10s
    command: ["-config", "/configs/logic.yaml", "-debug=false"]
    volumes:
      - ./configs/local/logic-2.docker.yaml:/configs/logic.yaml:ro
    ports:
      - "9192:9190/tcp"
    environment:
      - GOMAXPROCS=2
    cpus: 2.0
    cpuset: "5-6"
    mem_limit: 2g
    user: "0:0"
    cap_add:
      - NET_ADMIN
    depends_on:
      - http2gw
      - master
    networks:
      - app
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  logic-3:
    build:
      context: .
      dockerfile: Dockerfile
      target: logic
    image: logic-gateway/logic:local
    hostname: logic-3
    init: true
    stop_grace_period: 10s
    command: ["-config", "/configs/logic.yaml", "-debug=false"]
    volumes:
      - ./configs/local/logic-3.docker.yaml:/configs/logic.yaml:ro
    ports:
      - "9193:9190/tcp"
    environment:
      - GOMAXPROCS=2
    cpus: 2.0
    cpuset: "7-8"
    mem_limit: 2g
    user: "0:0"
    cap_add:
      - NET_ADMIN
    depends_on:
      - http2gw
      - master
    networks:
      - app
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  client-1:
    profiles: ["load"]
    build:
      context: .
      dockerfile: Dockerfile
      target: client
    image: logic-gateway/client:local
    hostname: client-1
    init: true
    volumes:
      - ./configs/local/http2client-1.docker.yaml:/configs/client.yaml:ro
      - ./scripts/fail-logs:/var/log/logic-gateway
      - ./scripts/run-logs:/var/log/run-logs
    environment:
      - GOMAXPROCS=2
    cpus: 2.0
    cpuset: "9-10"
    mem_limit: 1g
    depends_on:
      - http2gw
    networks:
      - app
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  client-2:
    profiles: ["load"]
    build:
      context: .
      dockerfile: Dockerfile
      target: client
    image: logic-gateway/client:local
    hostname: client-2
    init: true
    volumes:
      - ./configs/local/http2client-2.docker.yaml:/configs/client.yaml:ro
      - ./scripts/fail-logs:/var/log/logic-gateway
      - ./scripts/run-logs:/var/log/run-logs
    environment:
      - GOMAXPROCS=2
    cpus: 2.0
    cpuset: "11-12"
    mem_limit: 1g
    depends_on:
      - http2gw
    networks:
      - app
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  client-3:
    profiles: ["load"]
    build:
      context: .
      dockerfile: Dockerfile
      target: client
    image: logic-gateway/client:local
    hostname: client-3
    init: true
    volumes:
      - ./configs/local/http2client-3.docker.yaml:/configs/client.yaml:ro
      - ./scripts/fail-logs:/var/log/logic-gateway
      - ./scripts/run-logs:/var/log/run-logs
    environment:
      - GOMAXPROCS=2
    cpus: 2.0
    cpuset: "13-14"
    mem_limit: 1g
    depends_on:
      - http2gw
    networks:
      - app
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  client-4:
    profiles: ["load"]
    build:
      context: .
      dockerfile: Dockerfile
      target: client
    image: logic-gateway/client:local
    hostname: client-4
    init: true
    volumes:
      - ./configs/local/http2client-4.docker.yaml:/configs/client.yaml:ro
      - ./scripts/fail-logs:/var/log/logic-gateway
      - ./scripts/run-logs:/var/log/run-logs
    environment:
      - GOMAXPROCS=2
    cpus: 2.0
    cpuset: "15-16"
    mem_limit: 1g
    depends_on:
      - http2gw
    networks:
      - app
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  client-5:
    profiles: ["load"]
    build:
      context: .
      dockerfile: Dockerfile
      target: client
    image: logic-gateway/client:local
    hostname: client-5
    init: true
    volumes:
      - ./configs/local/http2client-5.docker.yaml:/configs/client.yaml:ro
      - ./scripts/fail-logs:/var/log/logic-gateway
      - ./scripts/run-logs:/var/log/run-logs
    environment:
      - GOMAXPROCS=2
    cpus: 2.0
    cpuset: "17-18"
    mem_limit: 1g
    depends_on:
      - http2gw
    networks:
      - app
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  client-6:
    profiles: ["load"]
    build:
      context: .
      dockerfile: Dockerfile
      target: client
    image: logic-gateway/client:local
    hostname: client-6
    init: true
    volumes:
      - ./configs/local/http2client-6.docker.yaml:/configs/client.yaml:ro
      - ./scripts/fail-logs:/var/log/logic-gateway
      - ./scripts/run-logs:/var/log/run-logs
    environment:
      - GOMAXPROCS=2
    cpus: 2.0
    cpuset: "9-10"
    mem_limit: 1g
    depends_on:
      - http2gw
    networks:
      - app
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  prometheus:
    image: prom/prometheus:v3.5.0
    hostname: prometheus
    init: true
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090/tcp"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    cpus: 1.0
    cpuset: "1"
    depends_on:
      - http2gw
    networks:
      - app
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  app:
    driver: bridge
    name: logic-gateway-local

volumes:
  prometheus_data:
